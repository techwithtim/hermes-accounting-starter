[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hermes-accounting-starter"
version = "0.1.0"
description = "A private-by-default bookkeeping starter for Hermes, with fictional demo data"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["babel>=2.17,<3", "pyyaml>=6,<7", "mcp>=1.20,<2", "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "jinja2>=3.1.6,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "pytest-asyncio>=0.25,<2"]

[project.scripts]
accounting-starter = "accounting_starter.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/accounting_starter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_default_fixture_loop_scope = "function"
